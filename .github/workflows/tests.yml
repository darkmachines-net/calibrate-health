# Run selected application suites and require successful results before merge.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Test Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.decision.outputs.backend }}
      mobile: ${{ steps.decision.outputs.mobile }}
      api: ${{ steps.decision.outputs.api }}
      api_contract: ${{ steps.decision.outputs.api_contract }}
      mcp: ${{ steps.decision.outputs.mcp }}

    steps:
      - name: Checkout complete PR history for affected checks
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected PR inputs
        if: github.event_name == 'pull_request'
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs

      - name: Select test surfaces
        id: decision
        shell: bash
        env:
          BACKEND_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
          API_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
          API_CONTRACT_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api_contract == 'true' }}
          MOBILE_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' }}
          MCP_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mcp == 'true' }}
        run: |
          echo "backend=${BACKEND_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "api=${API_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "api_contract=${API_CONTRACT_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "mobile=${MOBILE_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "mcp=${MCP_CHANGED}" >> "${GITHUB_OUTPUT}"

  backend-tests:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calibrate_ci
          POSTGRES_PASSWORD: calibrate_ci
          POSTGRES_DB: calibrate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate_ci -d calibrate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Verify fresh database migrations
        env:
          DATABASE_URL: postgresql://calibrate_ci:calibrate_ci@localhost:5432/calibrate_ci?schema=public
        run: npm run db:migrate

      - name: Run tests
        env:
          CALIBRATE_AUTH_TEST_DATABASE_URL: postgresql://calibrate_ci:calibrate_ci@localhost:5432/calibrate_ci
        run: npm test

  mobile-tests:
    name: Mobile Tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install mobile deps
        run: npm ci --no-audit --fund=false

      - name: Install API generator deps
        if: needs.changes.outputs.api_contract == 'true'
        run: npm ci --prefix backend --no-audit --fund=false

      - name: Validate API contract
        if: needs.changes.outputs.api_contract == 'true'
        run: npm run api:contract:check

      - name: Run API client tests
        if: needs.changes.outputs.api == 'true'
        run: npm run test:api-client

      - name: Run mobile tests
        if: needs.changes.outputs.mobile == 'true'
        run: npm --prefix mobile test

  mcp-tests:
    name: MCP App and Plugin Tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install host and App build dependencies
        run: |
          npm ci --no-audit --fund=false
          npm ci --prefix backend --no-audit --fund=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate plugin package and publication checks
        run: |
          node scripts/calibrate-plugin.mjs check
          node --test scripts/calibrate-plugin.test.mjs

      - name: Test progress App in its host bridge
        run: npm run test:mcp-app

  required-tests:
    name: Required Tests
    needs: [changes, backend-tests, mobile-tests, mcp-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify test gate behavior
        run: node --test scripts/ci-test-gate.test.mjs

      - name: Require successful selected tests
        env:
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-test-gate.mjs
