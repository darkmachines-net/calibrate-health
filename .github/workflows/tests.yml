name: Tests

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact canonical release candidate; validated by Cut release
        required: true
        type: string
      source_sha:
        description: Exact protected source and workflow commit
        required: true
        type: string
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.release_sha && format('candidate-{0}-{1}', github.run_id, github.run_attempt) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Test Inputs${{ inputs.release_sha && format(' [{0}]', inputs.release_sha) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.decision.outputs.backend }}
      mobile: ${{ steps.decision.outputs.mobile }}

    steps:
      - name: Checkout release candidate for identity verification
        if: inputs.release_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify explicit release candidate
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: node scripts/release-ci-gate.mjs --verify-inputs

      - name: Detect affected test surfaces
        if: inputs.release_sha == '' && github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '.github/workflows/tests.yml'
              - 'scripts/ci-test-gate*'
              - 'backend/**'
              - 'docs/openapi/v1.yaml'
              - 'docs/weight-trend-v2-tuning-report.json'
              - 'shared/**'
            mobile:
              - '.github/workflows/tests.yml'
              - 'scripts/ci-test-gate*'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'docs/openapi/v1.yaml'
              - 'mobile/**'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/api-client/**'
              - 'shared/**'

      - name: Select test surfaces
        id: decision
        shell: bash
        env:
          BACKEND_CHANGED: ${{ inputs.release_sha != '' || github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
          MOBILE_CHANGED: ${{ inputs.release_sha != '' || github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' }}
        run: |
          echo "backend=${BACKEND_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "mobile=${MOBILE_CHANGED}" >> "${GITHUB_OUTPUT}"

  backend-tests:
    name: Backend Tests${{ inputs.release_sha && format(' [{0}]', inputs.release_sha) || '' }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calibrate_ci
          POSTGRES_PASSWORD: calibrate_ci
          POSTGRES_DB: calibrate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate_ci -d calibrate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Verify fresh database migrations
        env:
          DATABASE_URL: postgresql://calibrate_ci:calibrate_ci@localhost:5432/calibrate_ci?schema=public
        run: npm run db:migrate

      - name: Run tests
        env:
          CALIBRATE_AUTH_TEST_DATABASE_URL: postgresql://calibrate_ci:calibrate_ci@localhost:5432/calibrate_ci
        run: npm test

  mobile-tests:
    name: Mobile Tests${{ inputs.release_sha && format(' [{0}]', inputs.release_sha) || '' }}
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install mobile deps
        run: npm ci --no-audit --fund=false

      - name: Install API generator deps
        run: npm ci --prefix backend --no-audit --fund=false

      - name: Validate API contract
        run: npm run api:contract:check

      - name: Run API client tests
        run: npm run test:api-client

      - name: Run mobile tests
        run: npm --prefix mobile test

  required-tests:
    name: Required Tests${{ inputs.release_sha && format(' [{0}]', inputs.release_sha) || '' }}
    needs: [changes, backend-tests, mobile-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify explicit release candidate
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: node scripts/release-ci-gate.mjs --verify-inputs

      - name: Verify test gate behavior
        run: node --test scripts/ci-test-gate.test.mjs

      - name: Require successful selected tests
        env:
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-test-gate.mjs
