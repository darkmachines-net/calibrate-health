# Release retries use the pinned workflow's immutable receipts and bounded reads from the protected default branch.
name: Release
on:
  workflow_dispatch:
    inputs:
      profile: { description: Configured release destination, type: choice, required: true, options: [production] }
      rebuild: { description: Force a new native build, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@2fdd2113d71dbc2720e67dac55b8928a6d58974c
    with: { profile: '${{ inputs.profile }}', rebuild: '${{ inputs.rebuild }}' }
    secrets: inherit
