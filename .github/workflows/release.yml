# Prepare development candidates on master, approve beta delivery, and keep public-store delivery manual.
name: Release
run-name: ${{ inputs.profile == 'production' && 'Public-store release' || 'Development preview and approved beta release' }}
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile: { description: 'beta: Play internal testing and TestFlight; production: Play drafts and TestFlight', type: choice, required: true, options: [beta, production], default: beta }
      rebuild: { description: Force a new native build, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write, id-token: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@5a9175108ba6c72cb7bd72faa62cc70ec6c7fc2a
    with: { profile: '${{ inputs.profile || ''beta'' }}', rebuild: '${{ inputs.rebuild || false }}' }
    secrets: inherit
