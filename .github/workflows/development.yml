# Manually build a custom development client or publish an isolated hosted preview through the shared toolkit.
name: Development
on:
  workflow_dispatch:
    inputs:
      operation: { description: Build a dev client or publish a hosted preview, type: choice, options: [build, update], default: build, required: true }
      platform: { description: Phone platform, type: choice, options: [android, ios], default: android, required: true }
      source: { description: Optional pushed branch name or full commit SHA; blank uses the master dispatch commit, type: string, default: '' }
permissions: { contents: read }
jobs:
  development:
    uses: darkmachines-net/expo-release-template/.github/workflows/development.yml@815199833882111632ce1b3e953e7f322e46ccab
    with: { operation: '${{ inputs.operation }}', platform: '${{ inputs.platform }}', source: '${{ inputs.source }}' }
    secrets: inherit
