interface:
  display_name: "Calibrate Progress"
  short_description: "Explore progress and chat with your health data"
  brand_color: "#2E7D32"
  default_prompt: "Use $calibrate-progress to open my progress explorer and help me understand my progress toward my goal."
dependencies:
  tools:
    - type: "mcp"
      value: "calibrate"
      description: "Private read-only Calibrate progress explorer and historical analysis service"
      transport: "streamable_http"
      url: "https://calibratehealth.darkmachines.net/mcp"
policy:
  allow_implicit_invocation: true
